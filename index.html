<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="description"
      content="The Password Generator web application is a tool designed to create secure and random passwords for users. The generated passwords meet high security standards and can be customized to suit individual needs. With the Password Generator, you can easily create strong and unique passwords to enhance your online security."
    />
    <meta
      name="keywords"
      content="password, generator, web, application, security, protection, secure, tool"
    />
  </head>

  <body style="display: none">
    <noscript>For optimal performance, ensure JavaScript is active.</noscript>
    <div class="flex-container">
      <h1>Password Generator</h1>

      <!-- <a
        class="link"
        href="password-strength.html"
        title="Read this quick guide to learn how to set better passwords on your accounts and protect your personal data"
        >Password Strength Guide</a
      > -->

      <div>
        <span>Password Length: </span
        ><input type="number" id="length" name="number" value="16" />
      </div>
      <label class="checkbox-container"
        >Include Lowercase:
        <input type="checkbox" id="includeLowerCase" checked="checked" /><span
          class="checkmark"
        ></span
      ></label>
      <label class="checkbox-container"
        >Include Uppercase:
        <input type="checkbox" id="includeUpperCase" checked="checked" /><span
          class="checkmark"
        ></span
      ></label>
      <label class="checkbox-container"
        >Include Numbers:
        <input type="checkbox" id="includeNumbers" checked="checked" /><span
          class="checkmark"
        ></span
      ></label>
      <label class="checkbox-container"
        >Include Symbols:
        <input type="checkbox" id="includeSymbols" checked="checked" /><span
          class="checkmark"
        ></span
      ></label>

      <a class="button" id="generate-and-copy-button"></a>

      <span id="password-strength"></span>

      <p id="password"></p>
    </div>

    <div id="footerContainer"></div>

    <script src="scripts/generate-and-copy-min.js"></script>
    <script src="scripts/ripples-min.js"></script>
    <script src="scripts/components-min.js"></script>
    <script src="scripts/meta-tags-min.js"></script>
    <script src="scripts/headings.js"></script>
  </body>
</html>
